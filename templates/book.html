{% extends "base.html" %}
{% block content %}
<section class="booking">
   <h1 class="heading-title">book your trip!</h1>
   <form action="{% url 'book' package.id %}" method="post" class="book-form">
      {% csrf_token %}
      <div class="flex">
         <div class="inputBox">
            <span>name :</span>
            <input type="text" placeholder="enter your name" name="name">
         </div>
         <div class="inputBox">
            <span>email :</span>
            <input type="email" placeholder="enter your email" name="email">
         </div>
         <div class="inputBox">
            <span>mobile no :</span>
            <input type="tel" placeholder="enter your number" name="mobileno" maxlength="10">
         </div>
         <div class="inputBox">
            <span>address :</span>
            <input type="text" placeholder="enter your city" name="address">
         </div>
         <div class="inputBox">
            <span>select package:</span> <br>
            <select id="location" name="location">
               {% for i in packages %}
               <option value="{{ i.ptitle}}">{{ i.ptitle }}</option>
               {% endfor %}
            </select>
            <input type="number" name="pprice" value="{{package.price}}" hidden> 
         </div>
         <div class="inputBox">
            <span>how many :</span>
            <input type="number" placeholder="number of guests" name="guests" min="1" max="10">
         </div>
         <div class="inputBox">
            <span>arrivals :</span>
            <input type="date" name="arrivals">
         </div>
         <div class="inputBox">
            <span>leaving :</span>
            <input type="date" name="leaving">
         </div>
         <div class="inputBox">
            <input type="text" name="order_id" value="{{order_id}}" hidden >
         </div>
         <div class="inputBox">
            <input type="text" name="payment" value="{{payment}}" hidden>
         </div>
      </div>
      <button class="btn" type="submit"><a>Pay</a></button>
   </form>
</section>
{% endblock content %}
