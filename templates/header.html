{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="shortcut icon" href="/static/images/favicon1.ico" type="image/x-icon">
   <title>Home Page</title>

   <!-- swiper css link  -->
   <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

   <!-- custom css file link  -->
   <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
   <!-- header section starts  -->
   <section class="header">
      <a href="{% url 'home' %}" class="logo">Shree</a>
      <nav class="navbar">
         <a href="{% url 'home' %}">home</a>
         <a href="{% url 'package' %}">package</a>
         <a href="{% url 'gallery' %}">Gallery</a>
         <a href="{% url 'about' %}">about</a>
         {% if user.is_authenticated %}
         <div class="dropdown">
            <a href="" class="dropbtn">{{request.user}}</a>
            <div class="dropdown-content">
               <img src="/static/images/log-out.png" alt="">
               <a href="{% url 'logout' %}">Log out</a>
            </div>
         </div>
         {% else %}
         <a href="{% url 'login' %}">Login</a>
         <!-- <a href="{% url 'signup' %}">Signup</a> -->
         {% endif %}
      </nav>
      <div id="menu-btn" class="fas fa-bars"></div>
   </section>
   <!-- header section ends -->
